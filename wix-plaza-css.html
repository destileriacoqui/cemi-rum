<style>
#dc-app .page-hero{position:relative;min-height:100dvh;display:flex;align-items:flex-end;overflow:hidden}
#dc-app .page-hero-bg{position:absolute;inset:0}
#dc-app .page-hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 45%;will-change:transform}
#dc-app .page-hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,rgba(12,5,2,.88) 0%,rgba(12,5,2,.44) 52%,rgba(12,5,2,.08) 100%)}
#dc-app .page-hero-bg::before{content:'';position:absolute;bottom:0;left:0;right:0;height:14rem;background:linear-gradient(to bottom,transparent,rgba(247,242,232,.12));z-index:1}
#dc-app .page-hero-content{position:relative;z-index:10;padding:0 4rem 7rem;max-width:1400px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:6rem}
#dc-app .page-hero-eyebrow{font-size:.62rem;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:#C49348;margin-bottom:1.75rem;display:flex;align-items:center;gap:1.25rem;opacity:.88}
#dc-app .page-hero-eyebrow::before{content:'';width:2rem;height:.5px;background:#C49348;flex-shrink:0;opacity:.8}
#dc-app .page-hero-h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(4.5rem,9vw,10.5rem);font-weight:200;color:#F7F2E8;line-height:.88;letter-spacing:-.04em}
#dc-app .page-hero-h1 em{font-style:italic;color:#C49348;display:block}
#dc-app .page-hero-sub{font-size:.92rem;font-weight:300;color:rgba(247,242,232,.52);line-height:1.9;max-width:44ch;margin-bottom:2.5rem}
#dc-app .page-hero-scroll{display:flex;flex-direction:column;align-items:flex-start;gap:.75rem}
#dc-app .page-hero-scroll span{font-size:.58rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,242,232,.35)}
#dc-app .scroll-line{width:.5px;height:4.5rem;background:linear-gradient(to bottom,transparent,rgba(247,242,232,.35));animation:dcgrow 2.4s cubic-bezier(.16,1,.3,1) infinite}
@keyframes dcgrow{0%{transform:scaleY(0);transform-origin:top;opacity:0}40%{opacity:1}100%{transform:scaleY(1);transform-origin:top;opacity:0}}
#dc-app .plaza-intro{padding:11rem 0 0}
#dc-app .plaza-intro-inner{max-width:1400px;margin:0 auto;padding:0 4rem;display:grid;grid-template-columns:1fr 1fr;gap:7rem;align-items:end}
#dc-app .plaza-panorama{position:relative;overflow:hidden;width:100%;height:560px;margin-top:7rem}
#dc-app .plaza-panorama-img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;filter:sepia(10%) contrast(1.03) brightness(.97);transition:transform 1s cubic-bezier(.16,1,.3,1)}
#dc-app .plaza-panorama:hover .plaza-panorama-img{transform:scale(1.02)}
#dc-app .plaza-panorama-tint{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,8,3,0) 40%,rgba(15,8,3,.52) 100%)}
#dc-app .plaza-pin{position:absolute;transform:translate(-50%,-50%);z-index:10;cursor:default}
#dc-app .plaza-pin-dot{width:11px;height:11px;border-radius:50%;background:#C49348;position:relative;z-index:2;box-shadow:0 0 0 3px rgba(196,147,72,.22)}
#dc-app .plaza-pin-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:1px solid #C49348;animation:dcpinpulse 2.4s ease-out infinite;opacity:0}
#dc-app .plaza-pin-ring.r2{animation-delay:.8s}
@keyframes dcpinpulse{0%{transform:translate(-50%,-50%) scale(.5);opacity:.9}100%{transform:translate(-50%,-50%) scale(2);opacity:0}}
#dc-app .plaza-pin-label{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(26,18,7,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#F7F2E8;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;padding:.5rem 1rem;pointer-events:none;opacity:0;transition:opacity .3s ease,transform .3s ease}
#dc-app .plaza-pin-label::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(26,18,7,.9)}
#dc-app .plaza-pin:hover .plaza-pin-label{opacity:1;transform:translateX(-50%) translateY(0)}
#dc-app .plaza-panorama-caption{position:absolute;bottom:2rem;left:2.5rem;right:2.5rem;z-index:10;display:flex;align-items:baseline;gap:2rem}
#dc-app .plaza-panorama-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2rem,4vw,3.5rem);font-weight:200;font-style:italic;color:#F7F2E8;letter-spacing:-.025em;line-height:1}
#dc-app .plaza-panorama-sub{font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(247,242,232,.42);padding-bottom:.3rem}
#dc-app .plaza-spaces{display:grid;grid-template-columns:repeat(3,1fr);border-top:.5px solid rgba(26,18,7,.1)}
#dc-app .plaza-space{padding:4rem 3.5rem 4.5rem;border-right:.5px solid rgba(26,18,7,.1)}
#dc-app .plaza-space:last-child{border-right:none}
#dc-app .plaza-space-num{font-family:'Cormorant Garamond',Georgia,serif;font-size:4rem;font-weight:200;color:rgba(26,18,7,.055);line-height:1;display:block;margin-bottom:-1.5rem;letter-spacing:-.03em}
#dc-app .plaza-space-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.75rem;font-weight:400;color:#1A1207;margin-bottom:.9rem;line-height:1.12;letter-spacing:-.015em}
#dc-app .plaza-space-body{font-size:.84rem;font-weight:300;color:#7D6654;line-height:1.9}
#dc-app .plaza-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;padding:10rem 4rem 12rem;max-width:1400px;margin:0 auto}
#dc-app .gallery-item{overflow:hidden;position:relative}
#dc-app .gallery-item img{width:100%;display:block;object-fit:cover;filter:sepia(10%) contrast(1.04);transition:transform .75s cubic-bezier(.16,1,.3,1);will-change:transform}
#dc-app .gallery-item:hover img{transform:scale(1.028)}
#dc-app .gallery-item:nth-child(1) img{aspect-ratio:4/5}
#dc-app .gallery-item:nth-child(2) img{aspect-ratio:4/5;margin-top:4rem}
#dc-app .gallery-item:nth-child(3) img{aspect-ratio:4/5;margin-top:2rem}
#dc-app .visit-cta{background:#EFE8D8;border-top:.5px solid rgba(26,18,7,.1);padding:10rem 4rem}
#dc-app .visit-cta-inner{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7rem;align-items:center}
#dc-app .visit-cta-h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.6rem,5vw,5.5rem);font-weight:200;line-height:1.0;letter-spacing:-.035em;color:#1A1207}
#dc-app .visit-cta-h2 em{font-style:italic;color:#8C3F16}
#dc-app .visit-cta-body{display:flex;flex-direction:column;gap:2rem}
#dc-app .visit-detail{display:flex;flex-direction:column;gap:.35rem}
#dc-app .visit-label{font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:#8C3F16;opacity:.9}
#dc-app .visit-val{font-size:.88rem;font-weight:300;color:#1A1207;line-height:1.6}
@media(max-width:1100px){
#dc-app .page-hero-content{padding:0 2.5rem 5rem;grid-template-columns:1fr;gap:3rem}
#dc-app .plaza-intro-inner{grid-template-columns:1fr;gap:3rem;padding:0 2.5rem}
#dc-app .plaza-panorama{height:420px}
#dc-app .plaza-spaces{grid-template-columns:1fr}
#dc-app .plaza-space{border-right:none;border-bottom:.5px solid rgba(26,18,7,.1)}
#dc-app .plaza-space:last-child{border-bottom:none}
#dc-app .plaza-gallery{grid-template-columns:1fr 1fr;padding:7rem 2.5rem 9rem}
#dc-app .gallery-item:nth-child(3){display:none}
#dc-app .visit-cta{padding:7rem 2.5rem}
#dc-app .visit-cta-inner{grid-template-columns:1fr;gap:4rem}
}
@media(max-width:768px){
#dc-app .page-hero{min-height:75dvh}
#dc-app .page-hero-content{padding:0 1.75rem 4.5rem}
#dc-app .plaza-intro{padding:8rem 0 0}
#dc-app .plaza-panorama{height:320px;margin-top:5rem}
#dc-app .plaza-gallery{grid-template-columns:1fr;padding:5rem 1.75rem 7rem}
#dc-app .gallery-item:nth-child(2) img{margin-top:0}
#dc-app .gallery-item:nth-child(3){display:block;margin-top:0}
#dc-app .gallery-item img{aspect-ratio:16/9!important}
}
</style>
