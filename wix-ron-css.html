<style>
#dc-app sup{font-size:.48em;vertical-align:super;font-weight:400;letter-spacing:0}
#dc-app .catalog{background:#F7F2E8;padding:12rem 0 14rem;position:relative;overflow:hidden}
#dc-app .catalog-inner{max-width:1400px;margin:0 auto;padding:0 4rem;position:relative;z-index:2}
#dc-app .catalog-header{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:end;margin-bottom:5.5rem}
#dc-app .catalog-eyebrow{font-size:.58rem;font-weight:400;letter-spacing:.38em;text-transform:uppercase;color:#C49348;display:inline-flex;align-items:center;gap:1.25rem;margin-bottom:2.25rem;opacity:.85}
#dc-app .catalog-eyebrow::after{content:'';width:3rem;height:.5px;background:#C49348;opacity:.65;flex-shrink:0}
#dc-app .catalog-h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.8rem,5vw,5.5rem);font-weight:200;color:#1A1207;line-height:1.02;letter-spacing:-.035em}
#dc-app .catalog-h2 em{font-style:italic;color:#8C3F16}
#dc-app .catalog-sub{font-size:.88rem;font-weight:300;color:#7D6654;line-height:1.9;max-width:46ch}
#dc-app .catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
#dc-app .catalog-category{grid-column:1/-1;padding:4rem 0 1.75rem;border-top:.5px solid rgba(26,18,7,.1);margin-top:1.5rem}
#dc-app .catalog-category:first-child{border-top:none;margin-top:0;padding-top:0}
#dc-app .catalog-category-label{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.9rem;font-weight:200;letter-spacing:-.01em;color:#8C3F16;display:flex;align-items:center;gap:1.75rem}
#dc-app .catalog-category-label::after{content:'';flex:1;height:.5px;background:#8C3F16;opacity:.3}
#dc-app .prod-card{display:block;position:relative;overflow:hidden;cursor:pointer;background:transparent;text-decoration:none;color:inherit}
#dc-app .prod-card:focus-visible{outline:1px solid #C49348;outline-offset:2px}
#dc-app .prod-img-wrap{position:relative;overflow:hidden;aspect-ratio:3/4;background:transparent}
#dc-app .prod-img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;padding:.5rem 1.5rem 0;transition:transform .8s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 8px 24px rgba(26,18,7,.10))}
#dc-app .prod-card:hover .prod-img{transform:scale(1.04)}
#dc-app [data-product="pitorro-coco-35"] .prod-img{object-fit:cover;padding:0}
#dc-app .prod-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(247,242,232,.98) 0%,rgba(247,242,232,.72) 42%,rgba(247,242,232,0) 68%);display:flex;flex-direction:column;justify-content:flex-end;padding:1.75rem 1.65rem;transform:translateY(62%);transition:transform .58s cubic-bezier(.16,1,.3,1)}
#dc-app .prod-card:hover .prod-overlay{transform:translateY(0)}
#dc-app .prod-overlay-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem;font-weight:300;color:#1A1207;letter-spacing:-.02em;line-height:1.1;margin-bottom:.45rem}
#dc-app .prod-overlay-teaser{font-size:.72rem;font-weight:300;color:#7D6654;line-height:1.75;margin-bottom:1rem}
#dc-app .prod-overlay-hint{font-size:.52rem;letter-spacing:.26em;text-transform:uppercase;color:#8C3F16;display:flex;align-items:center;gap:.6rem;opacity:.9}
#dc-app .prod-base-strip{padding:1.2rem 0 0;display:flex;justify-content:space-between;align-items:baseline}
#dc-app .prod-base-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;font-weight:300;color:#1A1207;letter-spacing:-.01em}
#dc-app .prod-base-type{font-size:.54rem;letter-spacing:.2em;text-transform:uppercase;color:#7D6654;opacity:.75}
@keyframes dcfadeUp{from{opacity:0;transform:translateY(1.4rem)}to{opacity:1;transform:none}}
#dc-app .catalog .reveal{animation:dcfadeUp .9s cubic-bezier(.16,1,.3,1) both}
#dc-app .catalog .d1{animation-delay:.12s}
#dc-app .catalog .d2{animation-delay:.24s}
@media(max-width:1100px){
#dc-app .catalog-inner{padding:0 2.5rem}
#dc-app .catalog-header{grid-template-columns:1fr;gap:2.5rem}
#dc-app .catalog-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
#dc-app .catalog{padding:9rem 0 11rem}
#dc-app .catalog-grid{grid-template-columns:repeat(2,1fr);gap:.75rem}
}
@media(max-width:520px){
#dc-app .catalog-grid{grid-template-columns:1fr}
}
</style>
