<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Destilería Coquí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    sup { font-size: 0.28em; vertical-align: super; line-height: 0; font-weight: 400; letter-spacing: 0; margin-left: -0.05em; }

    :root {
      --cream:      #F7F2E8;
      --cream-mid:  #EFE8D8;
      --cream-dark: #E7DAC9;
      --ink:        #1A1207;
      --amber:      #8C3F16;
      --gold:       #C49348;
      --muted:      #7D6654;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }

    /* ── NAV ─────────────────────────────────────── */
    nav {
      position: fixed; inset: 0 0 auto 0; z-index: 200;
      padding: 1.5rem 4rem;
      display: flex; align-items: center; justify-content: space-between;
      background: #F7F2E8;
      box-shadow: 0 0.5px 0 rgba(26,18,7,0.08);
    }
    .nav-logo { display: block; text-decoration: none; }
    .nav-logo img { display: block; width: clamp(9rem, 13vw, 11.5rem); height: auto; }
    .nav-links { display: flex; gap: 2.75rem; list-style: none; }
    .nav-links a {
      font-size: 0.68rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.4s ease;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a[aria-current="page"] { color: var(--amber); }

    /* ── HERO ─────────────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: 55% 45%;
      min-height: 100dvh;
      padding-top: 5rem;
    }

    /* Left: sticky bottle column */
    .hero-img-col {
      position: sticky; top: 0;
      height: 100dvh;
      background: var(--cream-mid);
      display: flex; align-items: flex-end; justify-content: center;
      overflow: hidden;
    }
    .hero-img-col::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(196,147,72,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-bottle {
      width: auto; max-width: 68%;
      height: 85vh;
      object-fit: contain;
      filter: drop-shadow(0 30px 80px rgba(26,18,7,0.16));
      transition: transform 1.4s cubic-bezier(0.16,1,0.3,1);
    }
    .hero-img-col:hover .hero-bottle { transform: scale(1.025) translateY(-10px); }

    /* Right: scrolling info */
    .hero-info-col {
      display: flex; flex-direction: column;
      padding: 0 5rem 0 4.5rem;
      justify-content: center;
      min-height: 100dvh;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 0.65rem;
      font-size: 0.58rem; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; margin-bottom: 4rem;
      transition: color 0.3s ease;
    }
    .back-link:hover { color: var(--ink); }
    .back-link svg { transition: transform 0.3s ease; }
    .back-link:hover svg { transform: translateX(-4px); }

    .product-eyebrow {
      font-size: 0.54rem; letter-spacing: 0.36em; text-transform: uppercase;
      color: var(--amber); display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.75rem; opacity: 0.9;
    }
    .product-eyebrow::before { content: ''; width: 2.5rem; height: 0.5px; background: var(--amber); }

    .product-name {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 5vw, 5.5rem);
      font-weight: 200; color: var(--ink);
      line-height: 0.95; letter-spacing: -0.045em;
      margin-bottom: 2.5rem;
    }

    .product-desc {
      font-size: 0.88rem; font-weight: 300; color: var(--muted);
      line-height: 2; max-width: 48ch;
      border-left: 2px solid var(--cream-dark);
      padding-left: 1.5rem;
      margin-bottom: 3.5rem;
    }

    /* Specs row */
    .specs-row {
      display: grid; grid-template-columns: repeat(3,1fr);
      border-top: 0.5px solid rgba(26,18,7,0.1);
      padding-top: 2rem; margin-bottom: 3.5rem;
      gap: 0;
    }
    .spec { border-right: 0.5px solid rgba(26,18,7,0.1); padding-right: 1.75rem; }
    .spec:nth-child(2) { padding: 0 1.75rem; }
    .spec:last-child { border-right: none; padding-left: 1.75rem; padding-right: 0; }
    .spec-label {
      font-size: 0.5rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--muted); display: block; margin-bottom: 0.45rem; opacity: 0.75;
    }
    .spec-val {
      font-family: var(--serif); font-size: 1.45rem; font-weight: 200;
      color: var(--ink); line-height: 1.1;
    }
    .spec-val.price { color: var(--amber); font-size: 1.75rem; }
    .spec-val.style { font-size: 0.85rem; font-weight: 300; font-family: var(--sans); letter-spacing: 0; color: var(--muted); }

    /* ── TASTING SECTION ──────────────────────────── */
    .tasting-section {
      padding: 5rem 4.5rem 5rem;
      border-top: 0.5px solid rgba(26,18,7,0.1);
      background: var(--cream);
      max-width: 100%;
    }
    .tasting-inner { max-width: 540px; }
    .tasting-heading {
      font-family: var(--serif); font-size: 2.2rem; font-weight: 200;
      color: var(--ink); letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .tasting-sub {
      font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em;
      margin-bottom: 3rem;
    }
    .tasting-notes { display: flex; flex-direction: column; gap: 1.5rem; }
    .tasting-row { display: flex; align-items: center; gap: 1.5rem; }
    .tasting-label {
      font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); width: 9rem; flex-shrink: 0;
    }
    .tasting-track { flex: 1; height: 1px; background: rgba(26,18,7,0.1); position: relative; }
    .tasting-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      background: linear-gradient(to right, var(--amber), var(--gold));
      width: 0; transition: width 1.6s cubic-bezier(0.16,1,0.3,1);
    }
    .tasting-num {
      font-family: var(--serif); font-size: 0.9rem; color: var(--gold);
      width: 2.5rem; text-align: right;
    }

    /* ── CTA BAND ─────────────────────────────────── */
    .cta-band {
      padding: 5rem 4.5rem;
      background: var(--cream-mid);
      display: flex; align-items: center; justify-content: space-between; gap: 3rem;
      flex-wrap: wrap;
    }
    .cta-text-head {
      font-family: var(--serif); font-size: clamp(1.6rem, 2.5vw, 2.4rem);
      font-weight: 200; color: var(--ink); letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }
    .cta-text-sub { font-size: 0.78rem; color: var(--muted); }
    .btn-amber {
      display: inline-flex; align-items: center; gap: 1rem;
      background: var(--amber); color: var(--cream);
      padding: 1.1rem 2.75rem;
      font-family: var(--sans); font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      text-decoration: none; white-space: nowrap;
      transition: background 0.35s ease;
    }
    .btn-amber:hover { background: #712F0F; }

    /* ── STRIPE BUY BUTTON ─────────────────────────── */
    .btn-buy {
      display: inline-flex; align-items: center; gap: 1rem;
      background: var(--ink); color: var(--cream);
      padding: 1.1rem 2.75rem;
      font-family: var(--sans); font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      text-decoration: none; white-space: nowrap;
      transition: background 0.35s ease, transform 0.15s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.2);
      border: 0; cursor: pointer;
    }
    .btn-buy:hover { background: #2e1c0e; }
    .btn-buy:active { transform: translateY(1px); }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2.5rem;
    }

    /* ── PRODUCT SHOWCASE ────────────────────────── */
    .ron-showcase {
      background:
        radial-gradient(circle at 78% 28%, rgba(140,63,22,0.08), transparent 23rem),
        radial-gradient(circle at 74% 72%, rgba(140,63,22,0.05), transparent 25rem),
        radial-gradient(circle at 10% 86%, rgba(125,102,84,0.06), transparent 24rem),
        linear-gradient(135deg, #fbf7ee 0%, #f8f1e3 100%);
      overflow: hidden;
    }

    /* ── LANDSCAPE SKETCH (product-specific) ─── */
    .hero-sketch {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .hero-sketch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 0.18;
    }
    .ron-hero {
      min-height: 100dvh;
      /* Top padding must clear the fixed nav (~122px tall) with breathing room
         so the back link is never tucked under it on short/zoomed viewports. */
      padding: clamp(10.5rem, 13vh, 12rem) clamp(2rem, 5vw, 6rem) 3rem;
      display: grid;
      grid-template-columns: minmax(18rem, 0.92fr) minmax(20rem, 1.08fr);
      gap: clamp(2rem, 7vw, 8rem);
      /* "safe" keeps the copy vertically centered when it fits, but anchors it
         to the top padding (instead of overflowing under the fixed nav) when
         the copy is taller than the viewport, e.g. on short/zoomed screens. */
      align-items: safe center;
      position: relative;
    }
    .ron-hero::after {
      content: '';
      position: absolute;
      inset: auto 50% 1.8rem auto;
      width: 1px;
      height: 3.5rem;
      background: linear-gradient(to bottom, rgba(196,147,72,0), rgba(196,147,72,0.8), rgba(196,147,72,0));
      opacity: 0.7;
    }
    .ron-copy {
      max-width: 43rem;
      position: relative;
      z-index: 2;
    }
    .ron-kicker {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.58rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 2.2rem;
    }
    .ron-kicker::before {
      content: '';
      width: 2.6rem;
      height: 1px;
      background: var(--amber);
    }
    .ron-title {
      font-family: var(--serif);
      font-size: clamp(4.5rem, 9vw, 8.75rem);
      line-height: 0.88;
      font-weight: 300;
      letter-spacing: -0.06em;
      color: var(--ink);
      margin-bottom: 1.8rem;
    }
    .ron-title em,
    .ron-split-title em,
    .ron-recipe-title em {
      color: var(--amber);
      font-style: italic;
      font-weight: 300;
    }
    .ron-tagline {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.6rem, 2.3vw, 2.25rem);
      line-height: 1.2;
      color: var(--amber);
      margin-bottom: 2rem;
    }
    .ron-intro {
      max-width: 34rem;
      color: var(--ink);
      font-size: clamp(0.98rem, 1.2vw, 1.12rem);
      line-height: 1.9;
      margin-bottom: 2.7rem;
      opacity: 0.75;
    }
    .ron-specs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.35rem;
      padding-top: 1.7rem;
      border-top: 1px solid rgba(26,18,7,0.12);
      max-width: 44rem;
    }
    .ron-spec-label {
      display: block;
      margin-bottom: 0.45rem;
      color: rgba(125,102,84,0.72);
      font-size: 0.52rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }
    .ron-spec-value {
      display: block;
      font-family: var(--serif);
      font-size: 1.45rem;
      line-height: 1;
      color: var(--amber);
    }
    .ron-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2.2rem;
    }
    .ron-actions .btn-buy {
      background: var(--amber);
      color: #fffaf0;
      border-radius: 999px;
      box-shadow: 0 1.15rem 2.5rem rgba(140,63,22,0.22);
    }
    .ron-actions .btn-buy:hover { background: #712F0F; }
    .ron-actions .btn-amber {
      background: rgba(255,255,255,0.38);
      color: var(--ink);
      border: 1px solid rgba(26,18,7,0.14);
      border-radius: 999px;
    }
    .ron-actions .btn-amber:hover { background: rgba(255,255,255,0.72); }
    .ron-stage {
      min-height: 42rem;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      z-index: 2;
    }
    .ron-stage::before,
    .ron-stage::after {
      content: '';
      position: absolute;
      border-radius: 999px;
      filter: blur(1px);
      z-index: -1;
    }
    .ron-stage::before {
      width: min(34rem, 70vw);
      height: min(34rem, 70vw);
      background: radial-gradient(circle, rgba(222,171,79,0.22), rgba(222,171,79,0.04) 56%, transparent 70%);
    }
    .ron-stage::after {
      width: min(24rem, 48vw);
      height: min(24rem, 48vw);
      transform: translate(7rem, 8rem);
      background: radial-gradient(circle, rgba(223,91,68,0.12), transparent 70%);
    }
    .ron-stage img {
      height: min(66vh, 48rem);
      max-height: 48rem;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2rem 3.5rem rgba(26,18,7,0.22));
      animation: ronBottleSettle 900ms cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes ronBottleSettle {
      from { opacity: 0; transform: translateY(1.8rem) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ron-scroll {
      position: absolute;
      left: 50%;
      bottom: 2.6rem;
      transform: translateX(-50%);
      color: rgba(125,102,84,0.72);
      font-size: 0.56rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .ron-story-section {
      padding: clamp(5rem, 9vw, 8.5rem) clamp(2rem, 6vw, 7rem);
      background: #fffdf8;
    }
    .ron-story-inner {
      max-width: 92rem;
      margin: 0 auto;
    }
    .ron-split-title {
      font-family: var(--serif);
      font-size: clamp(3.5rem, 7.5vw, 7rem);
      line-height: 0.98;
      font-weight: 300;
      letter-spacing: -0.06em;
      margin-bottom: 2.5rem;
    }
    .ron-note-copy {
      max-width: 56rem;
      color: var(--muted);
      font-size: clamp(1.3rem, 2vw, 1.75rem);
      line-height: 1.8;
      margin-bottom: 4.2rem;
    }
    .ron-tasting-notes {
      display: grid;
      gap: 1.5rem;
      margin-bottom: 4rem;
    }
    .ron-tasting-row {
      display: grid;
      grid-template-columns: 11rem 1fr 3rem;
      gap: 1.4rem;
      align-items: center;
    }
    .ron-tasting-row .tasting-label {
      width: auto;
      font-size: clamp(1rem, 1.35vw, 1.35rem);
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
    }
    .ron-tasting-row .tasting-track {
      height: 0.28rem;
      border-radius: 999px;
      background: #f1eadc;
      overflow: hidden;
    }
    .ron-tasting-row .tasting-fill {
      border-radius: inherit;
      background: linear-gradient(90deg, var(--amber), var(--gold));
    }
    .ron-tasting-row .tasting-num {
      font-size: 1.35rem;
      color: var(--amber);
    }
    .ron-note-grid {
      border-top: 1px solid rgba(26,18,7,0.12);
      padding-top: 2.6rem;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(2rem, 5vw, 5rem);
    }
    .ron-note-card h3 {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      color: var(--amber);
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }
    .ron-note-card p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }
    .ron-pour-section {
      padding: clamp(5rem, 8vw, 8rem) clamp(2rem, 6vw, 7rem);
      background: linear-gradient(180deg, #fffdf8 0%, #f8f1e3 100%);
      overflow: hidden;
    }
    .ron-pour-top {
      max-width: 92rem;
      margin: 0 auto 2.7rem;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
    }
    .ron-pour-grid {
      max-width: 92rem;
      margin: 0 auto;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(17rem, 1fr);
      gap: 1.35rem;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      padding-bottom: 1.8rem;
      scrollbar-color: var(--amber) #efe4cf;
    }
    .ron-pour-card img {
      width: 100%;
      height: clamp(19rem, 31vw, 31rem);
      object-fit: cover;
      border-radius: 0.55rem;
      box-shadow: 0 1.4rem 3rem rgba(26,18,7,0.08);
    }
    .ron-pour-card h3 {
      margin-top: 1.25rem;
      font: 300 1.7rem/1 var(--serif);
      color: var(--ink);
    }
    .ron-pour-card p {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .ron-pour-card {
      background: transparent;
      border: 0;
      padding: 0;
      text-align: left;
      cursor: pointer;
      color: inherit;
    }
    .cocktail-photo {
      width: 100%;
      height: clamp(19rem, 31vw, 31rem);
      border-radius: 0.55rem;
      box-shadow: 0 1.4rem 3rem rgba(26,18,7,0.08);
      object-fit: cover;
      transition: transform 0.55s cubic-bezier(0.16,1,0.3,1), box-shadow 0.55s cubic-bezier(0.16,1,0.3,1);
    }
    .ron-pour-card:hover .cocktail-photo,
    .ron-pour-card.is-active .cocktail-photo {
      transform: translateY(-0.35rem);
      box-shadow: 0 1.9rem 4rem rgba(26,18,7,0.12);
    }
    .ron-pour-card.is-active h3 { color: var(--amber); }
    .ron-recipe.is-cocktail-recipe {
      grid-template-columns: minmax(15rem, 0.72fr) minmax(20rem, 1.28fr);
    }
    .cocktail-recipe-art {
      min-height: 34rem;
      position: relative;
      overflow: hidden;
    }
    .cocktail-recipe-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .ron-recipe {
      display: grid;
      grid-template-columns: minmax(18rem, 1fr) minmax(18rem, 1fr);
      background: var(--cream);
      border-top: 1px solid rgba(26,18,7,0.1);
      border-bottom: 1px solid rgba(26,18,7,0.1);
    }
    .ron-recipe-photo {
      min-height: 44rem;
      background: linear-gradient(rgba(26,18,7,0.12), rgba(26,18,7,0.12)), url('img/coqui-plaza-bar.webp') center / cover;
    }
    .ron-recipe-copy {
      padding: clamp(4rem, 7vw, 7rem) clamp(2rem, 6vw, 6rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .ron-recipe-title {
      font-family: var(--serif);
      font-size: clamp(3.1rem, 5vw, 5.2rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
      font-weight: 300;
      margin-bottom: 2.6rem;
    }
    .ron-recipe-lists {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }
    .ron-recipe h3 {
      font-size: 0.56rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1.2rem;
    }
    .ron-recipe ul,
    .ron-recipe ol {
      list-style: none;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }
    .ron-recipe li {
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(26,18,7,0.09);
    }
    .ron-recipe ol { counter-reset: method; }
    .ron-recipe ol li {
      counter-increment: method;
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 1rem;
    }
    .ron-recipe ol li::before {
      content: counter(method);
      color: var(--amber);
      font-family: var(--serif);
      font-style: italic;
    }
    .ron-related-section {
      padding: clamp(5rem, 8vw, 8rem) clamp(2rem, 6vw, 7rem);
      background: var(--cream-mid);
    }
    .ron-related-section .related-grid {
      max-width: 92rem;
      margin: 0 auto;
    }
    .ron-related-section .related-heading,
    .ron-related-section .product-eyebrow {
      max-width: 92rem;
      margin-left: auto;
      margin-right: auto;
    }

      return `--cocktail-a:${color};--cocktail-b:#fff8e9;--cocktail-liquid:${color}bb;--cocktail-glow:${color}55;`;
    }

    function recipeVars(color) {
      return `--recipe-a:${color};--recipe-b:#fff4df;--recipe-liquid:${color}bb;`;
    }

    function displayProductName(product) {
      const name = product.name;
      const plain = plainText(name);
      if (plain.includes('Ron Coquí')) return plain.replace('Ron Coquí™ ', 'Ron Coquí<br><em>') + '.</em>';
      if (plain.includes('Pitorro')) return name.replace(' ', '<br><em>') + '.</em>';
      if (plain.includes('/')) return name.replace(' / ', '<br><em>/ ') + '.</em>';
      return `${name}<br><em>${product.style}.</em>`;
    }

    function productOrigin(slug) {
      return PRODUCT_ORIGINS[slug] || 'Puerto Rico';
    }

    function showcaseIntro(product) {
      return plainText(product.desc).replace(/\s+/g, ' ');
    }

    function beachSketch(slug) {
      // Beach - Ron Coquí white/citrus rums
      var beachSlugs = ['ron-blanco', 'ron-limon', 'caneca-blanco', 'caneca-limon'];
      // Forest/mountain - Pitorro traditional line
      var forestSlugs = ['pitorro-blanco', 'pitorro-coco-35', 'pitorro-coco-15', 'pitorro-cafe',
        'pitorro-tamarindo', 'pitorro-parcha', 'pitorro-pina', 'pitorro-fresa', 'pitorro-frutas',
        'mini-blanco', 'mini-coco', 'mini-parcha', 'mini-tamarindo', 'mini-cafe', 'carjakers'];
      // Tropical - Blends
      var img;
      if (beachSlugs.includes(slug)) img = 'img/sketch-beach-sunset.jpg';
      else if (forestSlugs.includes(slug)) img = 'img/sketch-forest-mountain.jpg';
      else img = 'img/sketch-tropical.jpg';
      return '<div class="hero-sketch" aria-hidden="true"><img decoding="async" src="' + img + '" alt="" loading="eager"></div>';
    }

    function renderCocktailCards(cocktails) {
      return cocktails.map((cocktail, index) => `
        <button type="button" class="ron-pour-card ${index === 0 ? 'is-active' : ''}" data-cocktail-index="${index}">
          <img decoding="async" src="${cocktail.img}" alt="${cocktail.name}" loading="lazy" class="cocktail-photo">
          <h3>${cocktail.name}</h3>
          <p>${cocktail.sub}</p>
        </button>
      `).join('');
    }

    function renderRecipe(cocktail) {
      return `
        <section class="ron-recipe is-cocktail-recipe" id="cocktailRecipe">
          <div class="cocktail-recipe-art">
            <img decoding="async" src="${cocktail.img}" alt="${cocktail.name}" loading="lazy">
          </div>
          <div class="ron-recipe-copy">
            <span class="product-eyebrow">Selected recipe</span>
            <h2 class="ron-recipe-title">How to make <em>${cocktail.name}.</em></h2>
            <div class="ron-recipe-lists">
              <div>
                <h3>Ingredients</h3>
                <ul>
                  ${cocktail.ingredients.map(item => `<li>${item}</li>`).join('')}
                </ul>
              </div>
              <div>
                <h3>Method</h3>
                <ol>
                  ${cocktail.method.map(step => `<li>${step}</li>`).join('')}
                </ol>
              </div>
            </div>
          </div>
        </section>`;
    }

    function renderProductShowcase(slug, p) {
      const cocktails = cocktailSet(slug);
      const firstCocktail = cocktails[0];
      return `
        <main class="ron-showcase">
          <section class="ron-hero">
            <div class="ron-copy">
              <a href="ron.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Our Rums
              </a>
              <span class="ron-kicker">${p.type}</span>
              <h1 class="ron-title">${displayProductName(p)}</h1>
              <p class="ron-tagline">${PRODUCT_SUBTITLES[slug] || 'A handcrafted spirit with Puerto Rican character.'}</p>
              <p class="ron-intro">${showcaseIntro(p)}</p>
              <div class="ron-specs">
                <div>
                  <span class="ron-spec-label">Alcohol</span>
                  <span class="ron-spec-value">${p.abv.replace(' ABV', '')}</span>
                </div>
                <div>
                  <span class="ron-spec-label">Style</span>
                  <span class="ron-spec-value">${p.style}</span>
                </div>
                <div>
                  <span class="ron-spec-label">Price</span>
                  <span class="ron-spec-value">${p.price}</span>
                </div>
              </div>
              <!-- Alcohol compliance block (verbatim mirror of AlcoholCompliance.copy.PRODUCT_DISCLAIMER) -->
              <p class="compliance-card-label">Alcohol product. Legal drinking age required.</p>
              <div class="compliance-product-block">
                Alcohol product. Must be of legal drinking age to purchase. Valid government-issued photo ID required at pickup or delivery. Orders may be refused or refunded if ID cannot be verified. Availability, pricing, and pickup/shipping options may change without notice.
              </div>
              <!-- Add to cart / buy now restored. Mandatory age + government-issued
                   photo ID confirmation is enforced at checkout (no matter what). -->
              <div class="ron-actions">
                <button type="button" class="btn-buy" data-add-cart>
                  Add to Cart
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M1 6.5H12M6.5 1L12 6.5L6.5 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <button type="button" class="btn-amber" data-add-cart data-buy-now>Buy Now</button>
              </div>
            </div>
            <div class="ron-stage">
              <img decoding="async" src="${p.img}" alt="${plainText(p.name)}">
            </div>
            <span class="ron-scroll">Scroll</span>
            ${beachSketch(slug)}
          </section>

          <section class="ron-story-section">
            <div class="ron-story-inner">
              <span class="product-eyebrow">Tasting notes</span>
              <h2 class="ron-split-title">${p.style}, <em>made for the island.</em></h2>
              <p class="ron-note-copy">A quick flavor map for ${plainText(p.name)}.</p>
              <div class="ron-tasting-notes" id="tastingNotes">
                ${p.notes.map(n => `
                  <div class="ron-tasting-row tasting-row">
                    <span class="tasting-label">${n.label}</span>
                    <div class="tasting-track"><div class="tasting-fill" data-w="${n.pct}%" style="width:${n.pct}%"></div></div>
                    <span class="tasting-num">${n.pct}</span>
                  </div>`).join('')}
              </div>
              <div class="ron-note-grid">
                <article class="ron-note-card">
                  <h3>Nose</h3>
                  <p>Fresh cane with a lift of light citrus and a soft floral edge.</p>
                </article>
                <article class="ron-note-card">
                  <h3>Palate</h3>
                  <p>Smooth and rounded, with gentle vanilla over a clean sugarcane core.</p>
                </article>
                <article class="ron-note-card">
                  <h3>Finish</h3>
                  <p>Crisp and dry, leaving the palate clean and ready for the next sip.</p>
                </article>
              </div>
            </div>
          </section>

          <!-- Cocktails temporarily removed for testing. To restore: re-add the
               ron-pour-section block (renderCocktailCards) and the renderRecipe call here. -->

          <section class="ron-related-section">
            <span class="product-eyebrow">Explore the collection</span>
            <h2 class="related-heading">Our recommended rums</h2>
            <div class="related-grid">
              ${renderRelatedCards(slug)}
            </div>
          </section>
        </main>`;
    }

    if (!p) {
      document.title = 'Not Found, Destilería Coquí';
      root.innerHTML = `
        <div class="not-found">
          <h1>Spirit not found.</h1>
          <p>That product doesn't exist in our lineup.</p>
          <a href="ron.html">← Back to Our Rums</a>
        </div>`;
    } else {
      document.title = plainText(p.name) + ', Destilería Coquí';

      const activeCocktails = cocktailSet(id, p);
      root.innerHTML = renderProductShowcase(id, p);

      const notesEl = document.getElementById('tastingNotes');
      if (notesEl) notesEl.querySelectorAll('.tasting-fill').forEach(bar => { bar.style.width = bar.dataset.w; });
      document.querySelectorAll('[data-cocktail-index]').forEach(button => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.cocktailIndex || 0);
          document.querySelectorAll('[data-cocktail-index]').forEach(card => card.classList.remove('is-active'));
          button.classList.add('is-active');
          document.getElementById('cocktailRecipe').replaceWith(new DOMParser().parseFromString(renderRecipe(activeCocktails[index]), 'text/html').body.firstElementChild);
          document.getElementById('cocktailRecipe').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      document.querySelectorAll('[data-add-cart]').forEach(button => {
        button.addEventListener('click', () => {
          const slug = button.dataset.cartSlug || id;
          const item = COQUI_CATALOG[slug];
          CoquiCart.add({ slug, ...item });
          if (button.dataset.buyNow !== undefined) {
            window.location.href = 'cart.html';
            return;
          }
          button.textContent = 'Added to Cart';
          setTimeout(() => { button.textContent = 'Add to Cart'; }, 1400);
        });
      });
    }
  </script>

    document.head.appendChild(s);
    var btn=document.createElement('button');btn.className='nav-toggle';btn.setAttribute('aria-label','Open menu');btn.setAttribute('aria-expanded','false');btn.innerHTML='<span></span><span></span><span></span>';nav.appendChild(btn);
    var links=[['historia.html','Our Story'],['ron.html','Our Rums'],['plaza.html','Plaza'],['/tours','Tours'],['index.html#eventos','Events'],['contact.html','Contact']];
    var m=document.createElement('div');m.className='mobile-menu';
    var h='<button class="mobile-menu-close" aria-label="Close menu">&#10005;</button>';
    links.forEach(function(l){h+='<a href="'+l[0]+'">'+l[1]+'</a>';});
    var hasSession=false;try{hasSession=!!JSON.parse(localStorage.getItem('coqui_supabase_session'))?.user;}catch(_){}
    h+='<div class="mobile-menu-sep"></div>';
    h+='<a href="'+(hasSession?'/account':'/login')+'" class="mobile-menu-account">'+(hasSession?'My Account':'Log In')+'</a>';
    h+='<a href="/cart" class="mobile-menu-account">Cart</a>';
    m.innerHTML=h;document.body.appendChild(m);
    function close(){m.classList.remove('open');document.body.classList.remove('menu-open');btn.setAttribute('aria-expanded','false');}
    btn.addEventListener('click',function(){m.classList.add('open');document.body.classList.add('menu-open');btn.setAttribute('aria-expanded','true');});
    m.querySelector('.mobile-menu-close').addEventListener('click',close);
    m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',close);});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
    window.addEventListener('resize',function(){if(window.innerWidth>768)close();});
  })();
  </script>
