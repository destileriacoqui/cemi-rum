<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Destilería Coquí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    sup { font-size: 0.48em; vertical-align: super; font-weight: 400; letter-spacing: 0; }

    :root {
      --cream:      #F7F2E8;
      --cream-mid:  #EFE8D8;
      --cream-dark: #E7DAC9;
      --ink:        #1A1207;
      --amber:      #8C3F16;
      --gold:       #C49348;
      --muted:      #7D6654;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }

    /* ── NAV ─────────────────────────────────────── */
    nav {
      position: fixed; inset: 0 0 auto 0; z-index: 200;
      padding: 1.5rem 4rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(247,242,232,0.96);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 0.5px 0 rgba(26,18,7,0.08);
    }
    .nav-logo {
      font-family: var(--serif); font-size: 1.3rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink); text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.75rem; list-style: none; }
    .nav-links a {
      font-size: 0.68rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.4s ease;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a[aria-current="page"] { color: var(--amber); }

    /* ── HERO ─────────────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: 55% 45%;
      min-height: 100dvh;
      padding-top: 5rem;
    }

    /* Left: sticky bottle column */
    .hero-img-col {
      position: sticky; top: 0;
      height: 100dvh;
      background: var(--cream-mid);
      display: flex; align-items: flex-end; justify-content: center;
      overflow: hidden;
    }
    .hero-img-col::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(196,147,72,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-bottle {
      width: auto; max-width: 68%;
      height: 85vh;
      object-fit: contain;
      filter: drop-shadow(0 30px 80px rgba(26,18,7,0.16));
      transition: transform 1.4s cubic-bezier(0.16,1,0.3,1);
    }
    .hero-img-col:hover .hero-bottle { transform: scale(1.025) translateY(-10px); }

    /* Right: scrolling info */
    .hero-info-col {
      display: flex; flex-direction: column;
      padding: 0 5rem 0 4.5rem;
      justify-content: center;
      min-height: 100dvh;
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 0.65rem;
      font-size: 0.58rem; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; margin-bottom: 4rem;
      transition: color 0.3s ease;
    }
    .back-link:hover { color: var(--ink); }
    .back-link svg { transition: transform 0.3s ease; }
    .back-link:hover svg { transform: translateX(-4px); }

    .product-eyebrow {
      font-size: 0.54rem; letter-spacing: 0.36em; text-transform: uppercase;
      color: var(--amber); display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.75rem; opacity: 0.9;
    }
    .product-eyebrow::before { content: ''; width: 2.5rem; height: 0.5px; background: var(--amber); }

    .product-name {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 5vw, 5.5rem);
      font-weight: 200; color: var(--ink);
      line-height: 0.95; letter-spacing: -0.045em;
      margin-bottom: 2.5rem;
    }

    .product-desc {
      font-size: 0.88rem; font-weight: 300; color: var(--muted);
      line-height: 2; max-width: 48ch;
      border-left: 2px solid var(--cream-dark);
      padding-left: 1.5rem;
      margin-bottom: 3.5rem;
    }

    /* Specs row */
    .specs-row {
      display: grid; grid-template-columns: repeat(3,1fr);
      border-top: 0.5px solid rgba(26,18,7,0.1);
      padding-top: 2rem; margin-bottom: 3.5rem;
      gap: 0;
    }
    .spec { border-right: 0.5px solid rgba(26,18,7,0.1); padding-right: 1.75rem; }
    .spec:nth-child(2) { padding: 0 1.75rem; }
    .spec:last-child { border-right: none; padding-left: 1.75rem; padding-right: 0; }
    .spec-label {
      font-size: 0.5rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--muted); display: block; margin-bottom: 0.45rem; opacity: 0.75;
    }
    .spec-val {
      font-family: var(--serif); font-size: 1.45rem; font-weight: 200;
      color: var(--ink); line-height: 1.1;
    }
    .spec-val.price { color: var(--amber); font-size: 1.75rem; }
    .spec-val.style { font-size: 0.85rem; font-weight: 300; font-family: var(--sans); letter-spacing: 0; color: var(--muted); }

    /* ── TASTING SECTION ──────────────────────────── */
    .tasting-section {
      padding: 5rem 4.5rem 5rem;
      border-top: 0.5px solid rgba(26,18,7,0.1);
      background: var(--cream);
      max-width: 100%;
    }
    .tasting-inner { max-width: 540px; }
    .tasting-heading {
      font-family: var(--serif); font-size: 2.2rem; font-weight: 200;
      color: var(--ink); letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .tasting-sub {
      font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em;
      margin-bottom: 3rem;
    }
    .tasting-notes { display: flex; flex-direction: column; gap: 1.5rem; }
    .tasting-row { display: flex; align-items: center; gap: 1.5rem; }
    .tasting-label {
      font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); width: 9rem; flex-shrink: 0;
    }
    .tasting-track { flex: 1; height: 1px; background: rgba(26,18,7,0.1); position: relative; }
    .tasting-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      background: linear-gradient(to right, var(--amber), var(--gold));
      width: 0; transition: width 1.6s cubic-bezier(0.16,1,0.3,1);
    }
    .tasting-num {
      font-family: var(--serif); font-size: 0.9rem; color: var(--gold);
      width: 2.5rem; text-align: right;
    }

    /* ── CTA BAND ─────────────────────────────────── */
    .cta-band {
      padding: 5rem 4.5rem;
      background: var(--cream-mid);
      display: flex; align-items: center; justify-content: space-between; gap: 3rem;
      flex-wrap: wrap;
    }
    .cta-text-head {
      font-family: var(--serif); font-size: clamp(1.6rem, 2.5vw, 2.4rem);
      font-weight: 200; color: var(--ink); letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }
    .cta-text-sub { font-size: 0.78rem; color: var(--muted); }
    .btn-amber {
      display: inline-flex; align-items: center; gap: 1rem;
      background: var(--amber); color: var(--cream);
      padding: 1.1rem 2.75rem;
      font-family: var(--sans); font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      text-decoration: none; white-space: nowrap;
      transition: background 0.35s ease;
    }
    .btn-amber:hover { background: #712F0F; }

    /* ── STRIPE BUY BUTTON ─────────────────────────── */
    .btn-buy {
      display: inline-flex; align-items: center; gap: 1rem;
      background: var(--ink); color: var(--cream);
      padding: 1.1rem 2.75rem;
      font-family: var(--sans); font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      text-decoration: none; white-space: nowrap;
      transition: background 0.35s ease, transform 0.15s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.2);
      border: 0; cursor: pointer;
    }
    .btn-buy:hover { background: #2e1c0e; }
    .btn-buy:active { transform: translateY(1px); }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2.5rem;
    }

    /* ── NOT FOUND ────────────────────────────────── */
    .not-found {
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 4rem 2rem;
    }
    .not-found h1 {
      font-family: var(--serif); font-size: 3.5rem; font-weight: 200;
      color: var(--ink); margin-bottom: 1rem;
    }
    .not-found p { color: var(--muted); margin-bottom: 2.5rem; }
    .not-found a {
      font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--amber); text-decoration: none;
    }

    /* ── FOOTER ───────────────────────────────────── */
    footer {
      background: var(--cream);
      padding: 4rem 4rem 3.5rem;
      border-top: 0.5px solid rgba(26,18,7,0.1);
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-logo { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); }
    .footer-copy { font-size: 0.65rem; font-weight: 300; color: var(--muted); letter-spacing: 0.04em; line-height: 1.7; text-align: center; }
    .footer-links { display: flex; gap: 2.5rem; list-style: none; }
    .footer-links a { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.35s ease; }
    .footer-links a:hover { color: var(--ink); }

    /* ── RESPONSIVE ───────────────────────────────── */
    @media (max-width: 1000px) {
      nav { padding: 1.5rem 2.5rem; }
      .hero { grid-template-columns: 1fr; min-height: unset; }
      .hero-img-col { position: relative; height: 60vw; min-height: 320px; max-height: 520px; }
      .hero-bottle { height: 90%; max-width: 55%; }
      .hero-info-col { padding: 3.5rem 2.5rem 4rem; min-height: unset; }
      .back-link { margin-bottom: 2.5rem; }
      .tasting-section { padding: 4rem 2.5rem; }
      .cta-band { padding: 4rem 2.5rem; flex-direction: column; align-items: flex-start; }
      footer { flex-direction: column; gap: 2rem; padding: 3rem 2.5rem; text-align: center; }
      .footer-links { flex-wrap: wrap; justify-content: center; }
    }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .hero-info-col { padding: 2.5rem 1.5rem 3rem; }
      .specs-row { grid-template-columns: 1fr 1fr; }
      .spec:last-child { grid-column: 1 / -1; border-right: none; border-top: 0.5px solid rgba(26,18,7,0.1); padding: 1.5rem 0 0; margin-top: 0.5rem; }
      .tasting-section { padding: 3rem 1.5rem; }
      .cta-band { padding: 3rem 1.5rem; }
    }
  </style>
</head>
