<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account - Destilería Coquí</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/js/commerce-pages.css"></head><body><nav><a class="nav-logo" href="/"><img src="/img/destileria-coqui-logo-v2.svg" alt="Destilería Coquí"></a></nav><main class="page"><span class="eyebrow">Customer Account</span><h1>Create your <em>account.</em></h1><p class="lede">Save your contact details and see your order history. You can still check out as a guest anytime.</p><div class="panel" style="max-width:38rem"><form class="form-grid" data-auth-form="signup"><label class="wide">Name<input required name="full_name" autocomplete="name"></label><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Phone<input name="phone" autocomplete="tel"></label><label class="wide">Password<input required minlength="8" type="password" name="password" autocomplete="new-password"></label><button class="btn">Create Account</button></form><p class="message" data-message></p><button class="btn secondary compact-left" type="button" data-resend-confirmation hidden>Resend Confirmation Email</button><p class="page-links">Already have an account? <a href="/login">Log in</a></p></div></main><script src="/js/site-commerce.js"></script><script src="/js/supabase-client.js"></script><script src="/js/account-page.js"></script></body></html>
