<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Website Under Maintenance — Destilería Coquí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4eee2;
      --paper-deep: #e8dcc8;
      --ink: #25170f;
      --muted: #806b5b;
      --copper: #9b4418;
      --line: rgba(91, 57, 36, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.68), transparent 30%),
        linear-gradient(135deg, var(--paper), var(--paper-deep));
      font-family: "Montserrat", Arial, sans-serif;
    }

    .page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 34px 22px;
    }

    .card {
      width: min(800px, 100%);
      border: 1px solid var(--line);
      background: rgba(248, 243, 233, 0.82);
      box-shadow: 0 24px 80px rgba(61, 38, 23, 0.12);
      padding: clamp(42px, 8vw, 88px) clamp(26px, 8vw, 86px);
      text-align: center;
    }

    .logo {
      width: min(360px, 82%);
      height: auto;
      margin-bottom: 48px;
    }

    .eyebrow,
    .owner-toggle,
    button {
      color: var(--copper);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 20px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(55px, 9vw, 92px);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 0.93;
    }

    .message {
      max-width: 540px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.85;
    }

    .owner-area {
      margin-top: 50px;
      border-top: 1px solid var(--line);
      padding-top: 28px;
    }

    .owner-toggle {
      border: 0;
      background: none;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .owner-toggle:hover,
    .owner-toggle:focus-visible {
      color: var(--ink);
    }

    form {
      display: none;
      max-width: 390px;
      margin: 24px auto 0;
    }

    form.visible { display: block; }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-align: left;
      text-transform: uppercase;
    }

    .password-row {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.65);
      color: var(--ink);
      font: inherit;
      padding: 14px 15px;
    }

    button[type="submit"] {
      border: 1px solid var(--copper);
      background: var(--copper);
      color: white;
      cursor: pointer;
      padding: 0 18px;
      white-space: nowrap;
    }

    button[type="submit"]:disabled { opacity: 0.7; }

    .error {
      min-height: 20px;
      margin: 13px 0 0;
      color: #a53222;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
    }

    @media (max-width: 520px) {
      .card { padding-inline: 22px; }
      .password-row { display: grid; }
      button[type="submit"] { padding: 15px 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="maintenance-heading">
      <img class="logo" src="/img/destileria-coqui-logo.png" alt="Destilería Coquí">
      <p class="eyebrow">Destilería Coquí, Inc.</p>
      <h1 id="maintenance-heading">Website Under Maintenance</h1>
      <p class="message">We are currently updating our website to improve your experience. Please check back soon.</p>

      <div class="owner-area">
        <button class="owner-toggle" id="owner-toggle" type="button" aria-expanded="false" aria-controls="owner-form">Enter as Owner</button>
        <form id="owner-form">
          <label for="owner-password">Owner password</label>
          <div class="password-row">
            <input id="owner-password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Enter Site</button>
          </div>
          <p class="error" id="owner-error" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    const toggle = document.getElementById('owner-toggle');
    const form = document.getElementById('owner-form');
    const password = document.getElementById('owner-password');
    const error = document.getElementById('owner-error');
    const submit = form.querySelector('button[type="submit"]');

    toggle.addEventListener('click', () => {
      const visible = form.classList.toggle('visible');
      toggle.setAttribute('aria-expanded', String(visible));
      if (visible) password.focus();
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';
      submit.disabled = true;
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ maintenanceAccess: true, password: password.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to enter the site.');
        window.location.href = '/';
      } catch (requestError) {
        error.textContent = requestError.message || 'Unable to enter the site.';
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
